<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="preload" href="/assets/icon.webp" as="image" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="icon" href="/assets/icon.ico" type="image/x-icon" />
    <title>Emiray Koz</title>
  </head>
  <body id="body">
    <!--
    <div
      id="image-background"
      class="fixed inset-0 bg-[url(/assets/song.webp)] bg-cover bg-bottom opacity-0 transition-opacity duration-300 blur-lg -m-6"
    ></div>
    -->
    <div class="main shadow-xl">
      <div class="card md:w-170 relative">
        <div class="flex items-start gap-1 -mt-20">
          <div class="w-28 h-28 mr-2 rounded-(--border-radius) shadow-2xl">
            <img
              src="/assets/icon.webp"
              class="w-full h-full rounded-(--border-radius)"
            />
          </div>
          <a
            href="/"
            class="h-12 w-22 rounded-t-(--border-radius) flex items-center justify-center text-black transition-colors hover:from-black/5 hover:to-black/15"
          >
            Home
          </a>
          <a
            href="/projects"
            class="h-12 w-22 rounded-t-(--border-radius) bg-linear-to-t from-black/5 to-black/15 flex items-center justify-center text-black"
          >
            Projects
          </a>
        </div>
        <h1 class="font-semibold mt-6 text-2xl flex items-center text-black">
          Emiray Koz <span class="text-black/50 ml-1.5">/projects</span>
        </h1>
        <div class="mt-6 grid md:grid-cols-2 gap-4">
          <a
            href="https://github.com/Virtnox"
            class="relative group overflow-clip transition-colors space-y-2 bg-black/5 hover:bg-black/10 rounded-(--border-radius) p-8 flex flex-col"
          >
            <div
              class="absolute transition-all duration-250 inset-0 opacity-50 group-hover:opacity-85 blur group-hover:blur-[1.5px] bg-[url(/assets/virtnox-preview.webp)] bg-size-[110%_auto] h-full w-full bg-center bg-no-repeat group-hover:translate-y-0"
            ></div>
            <div class="z-50">
              <img
                src="/assets/virtnox.webp"
                class="size-12 transition-all group-hover:invert"
              />
              <h3
                class="font-medium text-xl transition-colors text-black group-hover:text-white"
              >
                Virtnox
              </h3>
              <p
                class="transition-colors text-black/75 group-hover:text-white/75"
              >
                Virtnox is a modern hosting provider delivering reliable,
                flexible infrastructure that puts you in full control.
              </p>
            </div>
          </a>
          <a
            class="transition-colors space-y-2 bg-black/5 hover:bg-black/10 rounded-(--border-radius) p-8 flex flex-col"
          >
            <div class="opacity-50">
              <img src="/assets/lucide-question.png" class="size-12" />
              <h3 class="font-medium text-xl">Virtalk</h3>
              <p class="text-black/75">
                Virtalk is an assistive keyboard with predictive text and speech
                output that helps people communicate more easily.
              </p>
            </div>
          </a>
        </div>
      </div>
    </div>
    <div id="cursor"></div>
    <script>
      const cursor = document.getElementById("cursor");
      window.addEventListener("mousemove", (e) => {
        cursor.style.left = `${e.clientX}px`;
        cursor.style.top = `${e.clientY}px`;
      });
    </script>
  </body>
</html>
