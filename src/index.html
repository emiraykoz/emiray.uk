<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="preload" href="/assets/rackway.webp" as="image" />
    <link rel="preload" href="/assets/song.webp" as="image" />
    <link rel="preload" href="/assets/icon.webp" as="image" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="icon" href="/assets/icon.ico" type="image/x-icon" />
    <title>Emiray Koz</title>
  </head>
  <body id="body">
    <div
      id="image-background"
      class="fixed inset-0 bg-[url(/assets/song.webp)] bg-cover bg-bottom opacity-0 transition-opacity duration-300 blur-lg -m-6"
    ></div>
    <div class="main">
      <div class="card relative">
        <div class="flex items-start gap-1 -mt-20">
          <div class="w-32 h-32 mr-2 rounded-(--border-radius)">
            <img
              src="/assets/icon.webp"
              class="w-full h-full rounded-(--border-radius)"
            />
          </div>
          <div
            class="h-12 w-22 rounded-t-(--border-radius) bg-linear-to-t from-white/5 to-white/15 border-t-2 border-white/30 flex items-center justify-center text-white"
          >
            Home
          </div>
          <div
            class="h-12 w-22 rounded-t-(--border-radius) bg-white/5 border-t-2 border-transparent flex items-center justify-center text-white"
          >
            Projects
          </div>
        </div>
        <div class="flex items-center space-x-4 mt-4">
          <h1
            class="font-semibold text-3xl flex items-center filter-[drop-shadow(0_0_6px_rgba(255,255,255,0.5))] text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-at-sign-icon lucide-at-sign opacity-35 mr-2 size-6 mt-1.5"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8" /></svg
            >emiraykoz
          </h1>
          <div class="space-x-4 flex items-center ml-auto">
            <a
              onclick="alert('Email: emiray.koz@rackway.net')"
              title="Email"
              class="transition-opacity opacity-35 hover:opacity-100 hover:filter-[drop-shadow(0_0_6px_rgba(255,255,255,0.5))]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-mail-icon lucide-mail stroke-white size-6"
              >
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                <rect x="2" y="4" width="20" height="16" rx="2" />
              </svg>
            </a>
            <a
              href="https://github.com/emiraykoz"
              title="GitHub"
              class="transition-opacity opacity-35 hover:opacity-100 hover:filter-[drop-shadow(0_0_6px_rgba(255,255,255,0.5))]"
            >
              <svg
                role="img"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                class="fill-white size-6"
              >
                <path
                  d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                />
              </svg>
            </a>
            <a
              onclick="alert('Discord: @emiraykoz')"
              title="Discord"
              class="transition-opacity opacity-35 hover:opacity-100 hover:filter-[drop-shadow(0_0_6px_rgba(255,255,255,0.5))]"
            >
              <svg
                role="img"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                class="fill-white size-6"
              >
                <path
                  d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"
                />
              </svg>
            </a>
            <a
              href="https://github.com/Rackway"
              title="Rackway"
              class="transition-opacity opacity-35 hover:opacity-100 hover:filter-[drop-shadow(0_0_6px_rgba(255,255,255,0.5))]"
            >
              <img src="/assets/rackway.webp" class="size-6" />
            </a>
          </div>
        </div>
        <p class="text-white/50 mt-4">
          Software developer based in the United Kingdom, with a strong focus<br />on
          cloud infrastructure, hosting platforms & UI design.
        </p>
        <p class="text-white mt-4">
          <span class="text-xs text-white/50">EST</span>
          <span
            id="secondsCounter"
            class="bg-linear-to-t from-white/15 to-white/5 border-b border-white/30 px-2 rounded-(--border-radius)"
          ></span>
          seconds ago
        </p>
        <script>
          const birthDate = new Date("2011-01-12T04:02:00");
          function updateCounter() {
            const now = new Date();
            const diffSeconds = Math.floor((now - birthDate) / 1000);
            document.getElementById("secondsCounter").textContent = diffSeconds;
          }
          updateCounter();
          setInterval(updateCounter, 1000);
        </script>
      </div>
      <div class="h-4"></div>
      <div class="card flex flex-row! space-x-6 p-4!">
        <img
          src="/assets/song.webp"
          class="w-14 aspect-square rounded-(--border-radius)"
        />
        <p
          class="text-white font-semibold flex items-center min-w-0 overflow-hidden w-full"
        >
          <span class="truncate min-w-0">sounds of the melting pot</span>
          <span class="opacity-50 shrink-0 ml-1">.mp3</span>
        </p>
        <div class="flex items-center space-x-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-skip-back-icon lucide-skip-back stroke-white opacity-25 size-5"
          >
            <path
              d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"
            />
            <path d="M3 20V4" />
          </svg>
          <button id="play">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              id="play-icon"
              class="lucide lucide-play-icon lucide-play stroke-white size-5"
            >
              <path
                d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              id="pause-icon"
              class="lucide lucide-pause-icon lucide-pause stroke-white size-5 hidden"
            >
              <rect x="14" y="3" width="5" height="18" rx="1" />
              <rect x="5" y="3" width="5" height="18" rx="1" />
            </svg>
          </button>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-skip-forward-icon lucide-skip-forward stroke-white opacity-25 size-5"
          >
            <path d="M21 4v16" />
            <path
              d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"
            />
          </svg>
        </div>
      </div>
    </div>
    <canvas
      id="bars"
      class="absolute inset-0 w-screen h-screen pointer-events-none"
    ></canvas>
    <script type="module" src="/scripts/rot.js"></script>
    <script type="module" src="/scripts/music_player.js"></script>
  </body>
</html>
